<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 102.32 102.32">
  <defs><style>.b{fill:#f15a29;stroke:#fff;stroke-miterlimit:10;stroke-width:4px;}.w{fill:none;stroke:#fff;stroke-width:5px;stroke-linecap:round;stroke-linejoin:round;}</style></defs>
  <rect class="b" x="2" y="2" width="98.32" height="98.32" rx="12"/>
  <!-- UIS sump/siphon: U-shaped submerged passage with water surface -->
  <path class="w" d="M14,10 L14,65 Q14,90 51,90 Q88,90 88,65 L88,10"/>
  <!-- water surface (wavy line) inside sump -->
  <path class="w" d="M22,42 c8,-8 16,-8 24,0 c8,8 16,8 24,0"/>
  <!-- surface level line outside -->
  <line x1="5" y1="42" x2="14" y2="42" stroke="#fff" stroke-width="4"/>
  <line x1="88" y1="42" x2="97" y2="42" stroke="#fff" stroke-width="4"/>
</svg>
