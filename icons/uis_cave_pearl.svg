  <defs><style>.b{fill:#f15a29;stroke:#fff;stroke-miterlimit:10;stroke-width:4px;}.w{fill:none;stroke:#fff;stroke-width:4px;stroke-miterlimit:10;}.d{fill:#fff;}</style></defs>
