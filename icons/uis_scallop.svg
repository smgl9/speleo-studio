<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 102.32 102.32">
  <defs><style>.b{fill:#f15a29;stroke:#fff;stroke-miterlimit:10;stroke-width:4px;}.w{fill:none;stroke:#fff;stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;}</style></defs>
  <rect class="b" x="2" y="2" width="98.32" height="98.32" rx="12"/>
  <!-- UIS scallops: erosional bowl-shaped depressions on cave walls -->
  <!-- Wall baseline -->
  <line x1="6" y1="52" x2="96" y2="52" stroke="#fff" stroke-width="4"/>
  <!-- Scallop arcs above the wall line (curved erosional hollows) -->
  <path class="w" d="M6,52 a13,13 0 0,1 26,0"/>
  <path class="w" d="M32,52 a13,13 0 0,1 26,0"/>
  <path class="w" d="M58,52 a13,13 0 0,1 26,0"/>
  <path class="w" d="M84,52 a8,8 0 0,1 12,0"/>
</svg>
